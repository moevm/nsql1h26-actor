<div class="profile">
  <h1 class="profile_fullName">
    {{ actor()?.lastName }} {{ actor()?.firstName }} {{ actor()?.middleName ?? '' }}
  </h1>
  <app-profile-info [actor]="actor()"></app-profile-info>
  <app-profile-media
    [actorId]="actor()?.id"
    [photos]="actor()?.photos"
    [videos]="actor()?.videos"
  ></app-profile-media>
  <app-profile-experience
    [theatrePlayList]="actor()?.theatrePlayItems ?? []"
    [filmPlayList]="actor()?.films ?? []"
  ></app-profile-experience>
  <section class="profile-desc section-card">
    <h2>О себе</h2>
    <div class="profile-desc_content">
      <p>{{ actor()?.bio }}</p>
    </div>
  </section>
</div>
