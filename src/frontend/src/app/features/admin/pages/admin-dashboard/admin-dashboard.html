<div class="dashboard">
  <section class="dashboard-links">
    <h1>Панель управления</h1>
    <div class="links_box">
      <div class="links_item">
        <div>
          <h3>Добавление профиля</h3>
          <p>Добавить новый профиль</p>
        </div>
        <a [routerLink]="'profile/new'" class="card-link">Перейти</a>
      </div>
      <div class="links_item">
        <div>
          <h3>Университеты</h3>
          <p>Редактирование/Добавление университета</p>
        </div>
        <a [routerLink]="'universities'" class="card-link">Перейти</a>
      </div>
      <div class="links_item">
        <div>
          <h3>Импорт/Экспорт</h3>
          <p>Массовое импортирование или экспортирование данных</p>
        </div>
        <a [routerLink]="'import-export'" class="card-link">Перейти</a>
      </div>
    </div>
  </section>
  
  <section class="dashboard-statistic">
    <h2>Просмотр статистики</h2>

    <div class="stats">
      <div class="filters-section">
        <app-search-filters (filtersChange)="onFiltersChanged($event)">
        </app-search-filters>
      </div>

      <div class="chart-area">
        <div class="chart-settings">
          <div class="setting-item">
            <label for="xAxisSelect">Значение по оси X:</label>
            <select 
              id="xAxisSelect" 
              [(ngModel)]="selectedXAxis" 
              (change)="onChartOptionsChanged()">
              <option *ngFor="let option of xAxisOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
          </div>
          
          <div class="setting-item">
            <label for="groupBySelect">Группировка:</label>
            <select 
              id="groupBySelect" 
              [(ngModel)]="selectedGroupBy" 
              (change)="onChartOptionsChanged()">
              <option *ngFor="let option of groupByOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
          </div>
        </div>

        <div class="chart-wrapper">
          <div #chartContainer class="chart-container"></div>
        </div>
      </div>
    </div>
  </section>
</div>
