<div class="search-page">
  <div class="title_wrapper">
    <h1>Поиск по базе</h1>
  </div>

  <div class="search-page_wrapper">
    <app-search-filters (filtersChange)="onFiltersChange($event)"></app-search-filters>

    <app-search-bar [(query)]="query"></app-search-bar>

    <div class="search-page__results-wrap">
      <div class="search-page__results">
        @if (error()) {
          <p class="search-page__status search-page__status--error">{{ error() }}</p>
        } @else if (actors().length === 0) {
          <p class="search-page__status">Ничего не найдено</p>
        } @else {
          @for (actor of actors(); track actor.id) {
            <a [routerLink]="['/profile', actor.id]" class="card-link">
              <app-profile-card
                [fullName]="fullName(actor)"
                [birthDate]="actor.birthDate ?? undefined"
                [education]="actor.education?.[0]?.university?.name ?? undefined"
                [actorId]="actor.id ?? undefined"
                [imageId]="actor.photos?.[0]?.id ?? undefined"
              ></app-profile-card>
            </a>
          }
        }
      </div>
      <app-search-pagination
        [(actorsCount)]="actorsCount"
        [(currentPage)]="currentPage"
        [pageSize]="pageSize"
      ></app-search-pagination>
    </div>
  </div>
</div>
