components:
  schemas:
    Gender:
      type: string
      enum: [male, female]
      description: Gender

    Title:
      type: string
      description: Title / rank
      enum: [honored, national, none]

    ActorMediaType:
      type: string
      enum: [photo, video]
      description: Media type on upload

    MongoId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      description: "MongoDB ObjectId (24 hex characters)"

    ActorListResponse:
      type: object
      required: [total, actors]
      description: "Paged actor list and total row count matching filters (ignoring limit/offset)"
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: "Total actors matching filters (full set, not only current page)"
        actors:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
          description: "Page slice; empty when includeItems=false"

    LoginRequest:
      type: object
      required: [email, password]
      description: Admin login credentials
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      description: Successful login — JWT for Authorization Bearer header
      properties:
        token:
          type: string
          description: JWT
        expiresIn:
          type: integer
          description: Token lifetime in seconds
          nullable: true

    UnauthorizedError:
      type: object
      description: 401 response when JWT is missing or invalid
      properties:
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          description: Reason (e.g. token required or token expired)

    UniversityInfo:
      type: object
      description: "University data (aggregated when returning an actor)"
      readOnly: true
      properties:
        name:
          type: string
        shortName:
          type: string
          nullable: true
        oldNames:
          type: array
          items:
            type: string
          nullable: true

    EducationCreateItem:
      type: object
      description: "On create only university id is sent; name and year are resolved from the catalog in responses."
      additionalProperties: false
      required: [uniId]
      properties:
        uniId:
          $ref: '#/components/schemas/MongoId'
          description: "University id from the university catalog"

    EducationItem:
      type: object
      properties:
        uniId:
          $ref: '#/components/schemas/MongoId'
          description: "University ObjectId"
        graduationYear:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
        university:
          $ref: '#/components/schemas/UniversityInfo'
          description: "University (filled when returning actor; no extra request needed)"
          readOnly: true
          nullable: true

    FilmPlayItem:
      type: object
      properties:
        title:
          type: string
        year:
          type: integer
          nullable: true
        role:
          type: string
          nullable: true
        director:
          type: string
          nullable: true

    PhotoItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MongoId'
          readOnly: true
        caption:
          type: string
          nullable: true

    VideoItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MongoId'
          readOnly: true
        caption:
          type: string
          nullable: true

    ContactLinkItem:
      type: object
      description: "Contact link (social, personal site, etc.)"
      properties:
        name:
          type: string
          description: "Label (e.g. VK, Rutube)"
        url:
          type: string
          format: uri
          description: "Link URL"

    TheatrePlayItem:
      type: object
      description: "Theatre entry — name, years, plays"
      properties:
        name:
          type: string
          description: "Theatre name"
        years:
          type: string
          nullable: true
          description: "Years (e.g. 2010–2015)"
        plays:
          type: array
          items:
            $ref: '#/components/schemas/FilmPlayItem'
          description: "Plays"

    Actor:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MongoId'
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        height:
          type: integer
          nullable: true
        weight:
          type: integer
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        hairColor:
          type: string
          nullable: true
        eyeColor:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        title:
          $ref: '#/components/schemas/Title'
        phone:
          type: string
          nullable: true
          description: "Phone number"
        email:
          type: string
          format: email
          nullable: true
          description: "Email"
        links:
          type: array
          items:
            $ref: '#/components/schemas/ContactLinkItem'
          nullable: true
          description: "Contact links (social, site, etc.)"
        education:
          type: array
          items:
            $ref: '#/components/schemas/EducationItem'
        films:
          type: array
          items:
            $ref: '#/components/schemas/FilmPlayItem'
        theatrePlayItems:
          type: array
          items:
            $ref: '#/components/schemas/TheatrePlayItem'
          description: "Theatres and plays (for clients)"
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PhotoItem'
        mainPhotoId:
          $ref: '#/components/schemas/MongoId'
          nullable: true
          readOnly: true
          description: "ObjectId of main photo media (set on actor update, not on create)"
        videos:
          type: array
          items:
            $ref: '#/components/schemas/VideoItem'
        genres:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true

    ActorCreate:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        height:
          type: integer
          nullable: true
        weight:
          type: integer
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        hairColor:
          type: string
          nullable: true
        eyeColor:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        title:
          $ref: '#/components/schemas/Title'
        phone:
          type: string
          nullable: true
          description: "Phone number"
        email:
          type: string
          format: email
          nullable: true
          description: "Email"
        links:
          type: array
          items:
            $ref: '#/components/schemas/ContactLinkItem'
          nullable: true
          description: "Contact links (social, site, etc.)"
        education:
          type: array
          items:
            $ref: '#/components/schemas/EducationCreateItem'
          nullable: true
          description: "University id per entry only; other fields are read from the catalog when loading an actor"
        films:
          type: array
          items:
            $ref: '#/components/schemas/FilmPlayItem'
        theatrePlayItems:
          type: array
          items:
            $ref: '#/components/schemas/TheatrePlayItem'
        genres:
          type: array
          items:
            type: string

    ActorUpdate:
      type: object
      description: |
        Partial update (PATCH): send at least one field. Omitted fields keep previous values.
        List fields (links, education, films, theatrePlayItems, genres) replace the entire list when provided (use [] to clear).
        mainPhotoId must be one of the actor's photo ids from photos[].id; omit to leave unchanged.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        height:
          type: integer
          nullable: true
        weight:
          type: integer
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        hairColor:
          type: string
          nullable: true
        eyeColor:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        title:
          $ref: '#/components/schemas/Title'
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/ContactLinkItem'
          nullable: true
        education:
          type: array
          items:
            $ref: '#/components/schemas/EducationItem'
          nullable: true
        films:
          type: array
          items:
            $ref: '#/components/schemas/FilmPlayItem'
          nullable: true
        theatrePlayItems:
          type: array
          items:
            $ref: '#/components/schemas/TheatrePlayItem'
          nullable: true
        genres:
          type: array
          items:
            type: string
          nullable: true
        mainPhotoId:
          $ref: '#/components/schemas/MongoId'
          nullable: true
          description: "Must match an existing photos[].id; send null in JSON only if your client distinguishes omit vs null (otherwise omit)"

    ActorCreateResponse:
      type: object
      required: [status]
      properties:
        id:
          $ref: '#/components/schemas/MongoId'
          nullable: true
          description: "Actor id when status=ok"
        status:
          type: string
          enum: [ok, failed]
        errorCode:
          type: string
          nullable: true
          description: "Error code when status=failed"

    MediaUploadResponse:
      type: object
      required: [status]
      properties:
        mediaId:
          $ref: '#/components/schemas/MongoId'
          nullable: true
        status:
          type: string
          enum: [ok, failed]
        errorCode:
          type: string
          nullable: true
          description: "Error code when status=failed (e.g. ACTOR_NOT_FOUND)"

    UniversityCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "University full name"
        shortName:
          type: string
          nullable: true
          description: "Short name"
        oldNames:
          type: array
          items:
            type: string
          nullable: true
          description: "Former names"

    UniversityUpdate:
      type: object
      description: "Partial update: send at least one field. Empty string for shortName clears it; empty array for oldNames clears the list."
      properties:
        name:
          type: string
          description: "New full name"
        shortName:
          type: string
          nullable: true
          description: "Short name; empty string clears"
        oldNames:
          type: array
          items:
            type: string
          nullable: true
          description: "Replaces old names list entirely"

    UniversityCreateResponse:
      type: object
      required: [status]
      properties:
        id:
          $ref: '#/components/schemas/MongoId'
          nullable: true
          description: "University id when status=ok"
        status:
          type: string
          enum: [ok, failed]
        errorCode:
          type: string
          nullable: true
          description: "Error code when status=failed"

    UniversitySearchItem:
      type: object
      description: "University search result row (id + names)"
      properties:
        id:
          $ref: '#/components/schemas/MongoId'
        name:
          type: string
        shortName:
          type: string
          nullable: true
        oldNames:
          type: array
          items:
            type: string
          nullable: true
