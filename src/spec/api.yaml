openapi: 3.0.3
info:
  title: Actor API
  description: Actor catalog API
  version: 1.0.0

servers:
  - url: /v1
    description: API v1

paths:
  /auth/login:
    post:
      summary: Login (get JWT)
      operationId: v1AuthLoginPost
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT for Authorization Bearer header (mutating operations only)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/LoginResponse'
        '401':
          description: Invalid email or password

  /universities:
    post:
      summary: Create university
      operationId: v1UniversityCreatePost
      tags: [universities]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UniversityCreate'
      responses:
        '201':
          description: Create result (id + status ok/failed + errorCode)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UniversityCreateResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'

  /universities/search:
    get:
      summary: Search universities
      operationId: v1UniversitiesSearchGet
      tags: [universities]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search string (name, shortName, oldNames)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Max number of results
      responses:
        '200':
          description: Matching universities (id, name, shortName, oldNames)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/UniversitySearchItem'

  /universities/{id}:
    patch:
      summary: Update university by id
      operationId: v1UniversityByIdPatch
      tags: [universities]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
          description: University id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UniversityUpdate'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UniversityCreateResponse'
        '400':
          description: No fields to update or invalid body
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'
        '404':
          description: University not found
    delete:
      summary: Delete university by id
      operationId: v1UniversityByIdDelete
      tags: [universities]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
          description: University id
      responses:
        '204':
          description: University deleted
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'
        '404':
          description: University not found
        '409':
          description: University is still referenced by at least one actor (education.uniId)

  /actors:
    post:
      summary: Create actor
      operationId: v1ActorCreatePost
      tags: [actors]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ActorCreate'
      responses:
        '201':
          description: Create result (id + status ok/failed + errorCode)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ActorCreateResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'

    get:
      summary: List actors with filters
      operationId: v1ActorsGet
      tags: [actors]
      parameters:
        - name: gender
          in: query
          schema:
            $ref: './schemas.yaml#/components/schemas/Gender'
        - name: ageFrom
          in: query
          schema:
            type: integer
          description: Minimum age (years)
        - name: ageTo
          in: query
          schema:
            type: integer
          description: Maximum age (years)
        - name: weightMin
          in: query
          schema:
            type: integer
        - name: weightMax
          in: query
          schema:
            type: integer
        - name: heightMin
          in: query
          schema:
            type: integer
          description: Minimum height (cm)
        - name: heightMax
          in: query
          schema:
            type: integer
          description: Maximum height (cm)
        - name: activityYearFrom
          in: query
          schema:
            type: integer
          description: Activity year from
        - name: activityYearTo
          in: query
          schema:
            type: integer
        - name: universityId
          in: query
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
          description: University id
        - name: theatre
          in: query
          schema:
            type: string
        - name: title
          in: query
          schema:
            $ref: './schemas.yaml#/components/schemas/Title'
        - name: hairColor
          in: query
          schema:
            type: string
        - name: eyeColor
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
        - name: name
          in: query
          schema:
            type: string
          description: Substring match on full name (firstName, lastName, middleName), case-insensitive
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: includeItems
          in: query
          schema:
            type: boolean
            default: true
          description: |
            If false, actors is empty but total is still computed for the same filters (avoids loading the page of items).
      responses:
        '200':
          description: Actors page and total count matching filters
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ActorListResponse'

  /actors/stats:
    post:
      summary: Aggregated chart data (series by groupBy, x from xAxis)
      description: |
        Applies the same filters as GET /actors (optional body.filters).
        For xAxis filmYear / playYear, each film or play with a year produces a row (counts can exceed actor count).
        For other xAxis fields, one row per actor when the value is present.
        groupBy genre / university uses all values on the actor (multiple series per row).
      operationId: v1ActorsStatsPost
      tags: [actors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ActorStatsRequest'
      responses:
        '200':
          description: Series for charts (sorted series names and x values)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ActorStatsResponse'
        '400':
          description: Invalid xAxis, groupBy, or filter combination

  /actors/{id}:
    get:
      summary: Get actor by id
      operationId: v1ActorByIdGet
      tags: [actors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
      responses:
        '200':
          description: Actor
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Actor'
        '404':
          description: Not found

    patch:
      summary: Partially update actor
      operationId: v1ActorByIdPatch
      tags: [actors]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ActorUpdate'
      responses:
        '200':
          description: Updated actor
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Actor'
        '400':
          description: No fields to update, invalid university id, or invalid mainPhotoId
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'
        '404':
          description: Actor not found

    delete:
      summary: Delete actor profile
      operationId: v1ActorByIdDelete
      tags: [actors]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
      responses:
        '204':
          description: Actor deleted
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'
        '404':
          description: Actor not found

  /actors/{id}/media:
    post:
      summary: Upload actor media (photo or video to GridFS)
      operationId: v1ActorMediaUploadPost
      tags: [media]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
          description: Actor id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  $ref: './schemas.yaml#/components/schemas/ActorMediaType'
                caption:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Upload result (mediaId + status ok/failed + errorCode)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/MediaUploadResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'
        '400':
          description: Bad request
        '404':
          description: Actor not found

  /actors/{actorId}/media/{mediaId}:
    get:
      summary: Get media file by id (binary body from GridFS)
      operationId: v1MediaByIdGet
      tags: [media]
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
        - name: mediaId
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
          description: Media id from photos or videos list
      responses:
        '200':
          description: File (image/* or video/*)
          headers:
            Cache-Control:
              description: |
                Browser HTTP cache: max-age in seconds.
                Configured on the server as app.http.cache-control.media-max-age-seconds or MEDIA_CACHE_MAX_AGE_SECONDS (default 300).
                If set to 0 in config, the header is omitted.
              schema:
                type: string
                example: max-age=300
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Media not found
    delete:
      summary: Delete actor media file (GridFS) and remove references from actor
      operationId: v1MediaByIdDelete
      tags: [media]
      security:
        - bearerAuth: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
        - name: mediaId
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
      responses:
        '204':
          description: Media deleted
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'
        '404':
          description: Actor or media not found

  /catalog/export:
    get:
      summary: Export full database snapshot (JSON)
      description: Returns universities, actors, admins, and media files (Base64) in one document. Requires JWT.
      operationId: v1CatalogExportGet
      tags: [catalog]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalog snapshot
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/CatalogSnapshot'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'

  /catalog/import:
    post:
      summary: Import full database snapshot (replaces all data)
      description: |
        Replaces all universities, actors, admins, and GridFS media with the payload.
        Format must be `format: "nsql1-catalog"` and compatible `version`.
        Response has no body on success.
      operationId: v1CatalogImportPost
      tags: [catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/CatalogSnapshot'
      responses:
        '204':
          description: Import completed
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT for mutating operations (POST universities, actors, media; PATCH universities; DELETE actors and actor media; GET /catalog/export; POST /catalog/import)
