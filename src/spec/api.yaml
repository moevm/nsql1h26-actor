openapi: 3.0.3
info:
  title: Actor API
  description: API каталога актёров
  version: 1.0.0

servers:
  - url: /v1
    description: API v1

paths:
  /auth/login:
    post:
      summary: Вход (получить JWT)
      operationId: v1AuthLoginPost
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT для заголовка Authorization Bearer (только для операций изменения данных)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/LoginResponse'
        '401':
          description: Неверный email или пароль

  /universities:
    post:
      summary: Создать вуз
      operationId: v1UniversityCreatePost
      tags: [universities]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UniversityCreate'
      responses:
        '201':
          description: Результат создания (id + status ok/failed + errorCode)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UniversityCreateResponse'
        '401':
          description: Нет или невалидный JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'

  /universities/search:
    get:
      summary: Поиск вузов
      operationId: v1UniversitiesSearchGet
      tags: [universities]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Строка поиска (по name, shortName, oldNames)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Максимум результатов
      responses:
        '200':
          description: Список подходящих вузов (id, name, shortName, oldNames)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/UniversitySearchItem'

  /actors:
    post:
      summary: Создать актёра
      operationId: v1ActorCreatePost
      tags: [actors]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ActorCreate'
      responses:
        '201':
          description: Результат создания (id + status ok/failed + errorCode)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ActorCreateResponse'
        '401':
          description: Нет или невалидный JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'

    get:
      summary: Получить актёров по фильтрам
      operationId: v1ActorsGet
      tags: [actors]
      parameters:
        - name: gender
          in: query
          schema:
            $ref: './schemas.yaml#/components/schemas/Gender'
        - name: ageFrom
          in: query
          schema:
            type: integer
          description: Возраст от (лет)
        - name: ageTo
          in: query
          schema:
            type: integer
        - name: weightMin
          in: query
          schema:
            type: integer
        - name: weightMax
          in: query
          schema:
            type: integer
        - name: heightMin
          in: query
          schema:
            type: integer
          description: Рост от (см)
        - name: heightMax
          in: query
          schema:
            type: integer
          description: Рост до (см)
        - name: activityYearFrom
          in: query
          schema:
            type: integer
          description: Годы активности от
        - name: activityYearTo
          in: query
          schema:
            type: integer
        - name: universityId
          in: query
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
          description: ID вуза
        - name: theatre
          in: query
          schema:
            type: string
        - name: title
          in: query
          schema:
            $ref: './schemas.yaml#/components/schemas/Title'
        - name: hairColor
          in: query
          schema:
            type: string
        - name: eyeColor
          in: query
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: array
            items:
              type: string
        - name: name
          in: query
          schema:
            type: string
          description: Подстрока по ФИО (firstName, lastName, middleName), без учёта регистра
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список актёров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/Actor'

  /actors/{id}:
    get:
      summary: Получить актёра по ID
      operationId: v1ActorByIdGet
      tags: [actors]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
      responses:
        '200':
          description: Актёр
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Actor'
        '404':
          description: Не найден

    delete:
      summary: Удалить страницу актёра
      operationId: v1ActorByIdDelete
      tags: [actors]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
      responses:
        '204':
          description: Актёр удалён
        '401':
          description: Нет или невалидный JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'
        '404':
          description: Актёр не найден

  /actors/{id}/media:
    post:
      summary: Загрузить медиа актёра (фото или видео в GridFS)
      operationId: v1ActorMediaUploadPost
      tags: [media]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
          description: ID актёра
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  $ref: './schemas.yaml#/components/schemas/ActorMediaType'
                caption:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Результат загрузки (mediaId + status ok/failed + errorCode)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/MediaUploadResponse'
        '401':
          description: Нет или невалидный JWT
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/UnauthorizedError'
        '400':
          description: Ошибка запроса
        '404':
          description: Актёр не найден

  /actors/{actorId}/media/{mediaId}:
    get:
      summary: Получить медиафайл по id (бинарный контент из GridFS)
      operationId: v1MediaByIdGet
      tags: [media]
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
        - name: mediaId
          in: path
          required: true
          schema:
            $ref: './schemas.yaml#/components/schemas/MongoId'
          description: ID элемента в photos или videos
      responses:
        '200':
          description: Файл (image/* или video/*)
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Медиа не найдено

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT для операций, изменяющих данные (POST университетов, актёров, медиа)
