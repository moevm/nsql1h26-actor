spring:
  application:
    name: NOSQL

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  data:
    mongodb:
      # uri: mongodb://localhost:27017/nosql_db
      database: nosql_db
      auto-index-creation: true

  security:
    user:
      name: admin@example.com
      password: admin

app:
  admin:
    seed-email: ${ADMIN_EMAIL:admin@example.com}
    seed-password: ${ADMIN_PASSWORD:admin}
  mongodb:
    gridfs-bucket: media
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-256-bits}
    expiration-seconds: ${JWT_EXPIRATION:86400}

server:
  port: 8080

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: DEBUG
